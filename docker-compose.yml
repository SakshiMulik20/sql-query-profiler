services:
  postgres:
    image: postgres:16
    container_name: sql-query-profiler-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sqlprofiler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - profiler_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlprofiler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  profiler_pgdata: